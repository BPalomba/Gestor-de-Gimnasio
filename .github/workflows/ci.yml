name: CI — Gym Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5        # ← v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar tests
        run: mvn test -Dspring.profiles.active=test

      - name: Publicar resultados de tests
        uses: dorny/test-reporter@v2       # ← v2
        if: always()
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Build del JAR
        if: github.ref == 'refs/heads/main' && success()
        run: mvn clean package -DskipTests

      - name: Subir JAR como artefacto
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: gymsaas-jar
          path: target/*.jar
          retention-days: 7